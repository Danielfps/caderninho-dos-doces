<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderninho — controle de fiado</title>
<meta name="description" content="Anote quem comprou fiado, quanto deve e quem já pagou. As contas o Caderninho faz sozinho.">
<meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderninho">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, barra azul no topo, conteúdo em cartões e listas simples e barra de abas fixa embaixo com "Anotar venda" em destaque */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f4; --ink:#15181e; --muted:#5d6573; --line:#e1e4ea;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e8eefc; --bar:#1d4ed8; --bar-ink:#ffffff;
  --good:#15803d; --good-soft:#e6f4ea; --bad:#c2321b; --bad-soft:#fcebe7; --warn:#a15c07; --warn-soft:#fdf1e1;
  --shadow:0 1px 2px rgba(16,24,40,.06); --lift:0 10px 30px rgba(16,24,40,.18);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#171a20; --surface-2:#20242c; --ink:#eceef2; --muted:#9ba3b0; --line:#2a2f39;
  --accent:#7c9dff; --accent-ink:#0a1433; --accent-soft:#1b2747; --bar:#171a20; --bar-ink:#eceef2;
  --good:#5ccf8a; --good-soft:#132a1d; --bad:#ff8c76; --bad-soft:#3a1c17; --warn:#f2b45a; --warn-soft:#3a2a12;
  --shadow:none; --lift:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --surface-2:#20242c; --ink:#eceef2; --muted:#9ba3b0; --line:#2a2f39;
  --accent:#7c9dff; --accent-ink:#0a1433; --accent-soft:#1b2747; --bar:#171a20; --bar-ink:#eceef2;
  --good:#5ccf8a; --good-soft:#132a1d; --bad:#ff8c76; --bad-soft:#3a1c17; --warn:#f2b45a; --warn-soft:#3a2a12;
  --shadow:none; --lift:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .top{border-bottom-color:var(--line)} }
:root[data-theme="dark"] .top{border-bottom-color:var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700;font-size:1.2rem;line-height:1.15;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:.8rem;letter-spacing:0;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>span:last-child{min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.icon-btn{width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.opt{color:var(--muted);font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.hero{padding:20px}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-weight:700;font-size:2.5rem;line-height:1.1;letter-spacing:-.03em;margin-top:6px}
.mid{font-weight:700;font-size:1.45rem;line-height:1.2;letter-spacing:-.02em;margin-top:4px}
.c-bad{color:var(--bad)} .c-good{color:var(--good)} .c-accent{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{min-width:0}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:46px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:12px;border:0;
  font-weight:600;font-size:1.02rem;background:var(--accent);color:var(--accent-ink);text-decoration:none;width:100%}
.btn svg{width:22px;height:22px;flex:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.good{background:var(--good);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{width:auto;flex:none;min-height:48px;padding:0 16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list.off .item{opacity:.6}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:66px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.name{display:block;font-weight:600;font-size:1.02rem;overflow-wrap:anywhere;line-height:1.3}
.sub{display:block;font-size:.86rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.35;margin-top:2px}
.val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:20px;height:20px;color:var(--muted);flex:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:.92rem;letter-spacing:.02em;flex:none}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:.95rem;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:22px;height:22px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--good-soft);color:var(--good)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.95rem}
.input{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:1.05rem;width:100%}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea.input{padding:12px 14px;min-height:110px;font-size:.85rem}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--muted)}
.money .input{padding-left:46px;font-weight:700;font-size:1.25rem}

.pick.on{background:var(--accent-soft)}
.pick-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;text-align:left;min-height:48px}
.stepper{display:grid;grid-template-columns:48px 34px 48px;align-items:center;flex:none}
.stepper button,.add,.x{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.5rem;font-weight:500;line-height:1;flex:none}
.stepper output{text-align:center;font-weight:700;font-size:1.15rem}
.add{border:0;background:var(--accent-soft);color:var(--accent)}
.add svg,.x svg{width:22px;height:22px}
.x{color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip small{font-weight:500;color:var(--muted);font-size:.8rem}
.chip.nova{border-style:dashed;color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}

.toggle{display:flex;align-items:center;gap:14px;min-height:58px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;font-weight:600}
.toggle .sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.toggle[aria-checked="true"] .sw{background:var(--good)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(22px)}

.checkout{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 12px 12px 18px;box-shadow:var(--lift)}
.checkout .lbl{color:inherit;opacity:.7}
.checkout .mid{margin:0}
.checkout .btn{width:auto;flex:none;padding:0 26px}

.empty{text-align:center;padding:24px 18px;background:var(--surface);border-radius:var(--r);border:1.5px dashed var(--line);display:flex;flex-direction:column;gap:12px;align-items:center}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;margin:4px 0}
.steps div{display:flex;gap:12px;align-items:center;font-weight:500}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}

.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-weight:500}
.banner button{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;min-height:44px;padding:0 14px;font-weight:600}

.back{align-self:flex-start;border:0;background:transparent;font-weight:600;color:var(--accent);min-height:44px;padding:0;display:flex;align-items:center;gap:6px;font-size:1rem}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;min-height:44px;padding:0 4px;align-self:center}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;min-height:62px;font-weight:600;font-size:.76rem;color:var(--muted)}
.tab .ico{display:grid;place-items:center;width:58px;height:32px;border-radius:999px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ico{background:var(--accent-soft);color:var(--accent)}
.tab.sell .ico{background:var(--accent);color:var(--accent-ink)}
.tab.sell{color:var(--ink)}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet::before{content:"";width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.fotobox{width:128px;max-width:100%;aspect-ratio:1/1;border-radius:16px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;align-self:center}
.fotobox img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);
  display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;box-shadow:var(--lift);max-width:calc(100% - 32px);width:max-content}
.toast svg{width:20px;height:20px;flex:none}
.toast.erro{background:var(--bad);color:var(--surface)}

/* planilha: abas, mês, tabelas e linhas "rótulo … valor" */
.abas{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas .chip{flex:none;min-height:44px}
.mesbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.mesbar b{display:block;font-weight:600}
.mesbar b::first-letter{text-transform:uppercase}
.mesbar .x{border:0;font-size:1.6rem;color:var(--accent)}
.tabela-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tabela{border-collapse:collapse;width:100%;font-size:.88rem}
.tabela th,.tabela td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.tabela thead th{border-top:0;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tabela .num{text-align:right;font-variant-numeric:tabular-nums}
.tabela tbody th{font-weight:500;white-space:normal;min-width:140px}
.tabela tr[data-act]{cursor:pointer}
.tabela tfoot th,.tabela tfoot td{font-weight:700;background:var(--surface-2)}
.kvs{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kv>span{color:var(--muted);font-size:.92rem}
.kv>b{white-space:nowrap;font-variant-numeric:tabular-nums}
button.card{font:inherit;color:inherit;text-align:left;width:100%}
.barra{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.barra span{display:block;height:100%;background:var(--accent);border-radius:inherit}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neutra{background:var(--surface-2);color:var(--muted)}
.aviso{margin:0;padding:10px 12px;border-radius:10px;font-weight:600}
.aviso.good{background:var(--good-soft);color:var(--good)} .aviso.bad{background:var(--bad-soft);color:var(--bad)} .aviso.neutra{background:var(--surface-2)}
.passo{display:flex;gap:12px;align-items:center;border:0;background:transparent;text-align:left;padding:4px 0;min-height:48px;width:100%}
.passo i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
select.input{padding-right:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.big{font-size:2.1rem}.mid{font-size:1.25rem}.checkout .btn{padding:0 18px}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M8.5 3v18M12 8h4M12 12h4"/></svg></span>
    <span>Caderninho<small id="marca">Controle de fiado</small></span></div>
  <button class="icon-btn" data-act="config" aria-label="Ajustes e cópia de segurança">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div></header>

<main id="app"><div class="card">Abrindo o caderninho…</div></main>

<nav class="tabs" aria-label="Menu principal"><div class="tabs-in">
  <button class="tab" data-act="ir" data-v="resumo"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></span>Resumo</button>
  <button class="tab" data-act="ir" data-v="clientes"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg></span>Clientes</button>
  <button class="tab sell" data-act="ir" data-v="vender"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>Anotar venda</button>
  <button class="tab" data-act="ir" data-v="produtos"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>Produtos</button>
</div></nav>

<div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const r2=n=>Math.round((Number(n)||0)*100)/100;
function parseMoney(s){s=String(s||'').trim().replace(/R\$|\s/g,'');if(!s)return NaN;if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}const n=parseFloat(s);return isFinite(n)?r2(n):NaN}
const moneyStr=n=>(Number(n)||0).toFixed(2).replace('.',',');
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fmtData=s=>s?s.split('-').reverse().join('/'):'';
const fmtCurta=s=>{if(!s)return '';const[a,m,d]=s.split('-');return d+'/'+m+(a===hoje().slice(0,4)?'':'/'+a.slice(2))};
function haQuanto(s){const d=Math.max(0,Math.round((Date.parse(hoje())-Date.parse(s))/864e5));return d===0?'hoje':d===1?'ontem':`há ${d} dias`}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* busca sem ligar para acento e maiúscula: "joao" acha "João" */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const bate=(c,b)=>!b||norm(c.nome).includes(b)||norm(c.obs).includes(b);
const porNome=(a,b)=>a.nome.localeCompare(b.nome,'pt-BR');
function iniciais(n){const p=String(n||'').trim().split(/\s+/).filter(Boolean).map(w=>Array.from(w)[0]);return esc(((p.length>1?p[0]+p[p.length-1]:p[0])||'?').toUpperCase())}
const IC={
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-8 8"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  grade:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>',
  baixar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  trazer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- dados (guardados no próprio celular) ---------- */
const KEY='caderninho-v1';
let S={produtos:[],clientes:[],lanc:[],ajustes:{negocio:''},planilha:null,ultimoBackup:null};
function abrirIDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('caderninho',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function carregar(){
  try{const db=await abrirIDB();const v=await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(v){S=Object.assign(S,v);return}}catch(e){}
  try{const v=localStorage.getItem(KEY);if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}
}
/* dados antigos (e cópias antigas) não têm "ajustes" nem "planilha": completa com o padrão */
function completar(){S.ajustes=Object.assign({negocio:''},S.ajustes);S.planilha=Object.assign(planilhaPadrao(),S.planilha)}
async function salvar(){
  const copia=JSON.parse(JSON.stringify(S));
  let ok=false;
  try{const db=await abrirIDB();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(copia,KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});ok=true}catch(e){}
  if(!ok){try{localStorage.setItem(KEY,JSON.stringify(copia));ok=true}catch(e){}}
  if(!ok)toast('Não consegui guardar no celular. Faça uma cópia de segurança agora.',true);
}

/* ---------- contas ---------- */
/* "ajuste" (presente/desconto ou correção) entra com o próprio sinal: negativo diminui a dívida, positivo aumenta */
function saldo(id){let v=0,p=0,a=0;for(const l of S.lanc){if(l.clienteId!==id)continue;if(l.tipo==='venda')v+=l.valor;else if(l.tipo==='ajuste')a+=l.valor;else p+=l.valor}return{vendido:r2(v),pago:r2(p),ajuste:r2(a),deve:r2(v+a-p)}}
const abate=l=>l.tipo==='pag'||(l.tipo==='ajuste'&&l.valor<0);
/* dia da compra mais antiga que ainda não foi paga (os pagamentos quitam primeiro as compras mais antigas) */
function desde(id){
  const ls=S.lanc.filter(l=>l.clienteId===id).sort((a,b)=>(a.data+a.criado).localeCompare(b.data+b.criado));
  let pago=0;for(const l of ls)if(abate(l))pago+=Math.abs(l.valor);
  let soma=0;for(const l of ls){if(abate(l))continue;soma+=l.valor;if(soma-pago>0.004)return l.data}
  return null;
}
function resumo(mes){
  let vend=0,rec=0,custo=0,avulso=false;
  for(const l of S.lanc){if(mes&&!String(l.data).startsWith(mes))continue;if(l.tipo==='venda'){vend+=l.valor;custo+=l.custo||0;if(l.itens.some(i=>!i.produtoId))avulso=true}else if(l.tipo==='ajuste')vend+=l.valor;else rec+=l.valor}
  let falta=0,devendo=0;for(const c of S.clientes){const d=saldo(c.id).deve;if(d>0){falta+=d;devendo++}}
  return{vend:r2(vend),rec:r2(rec),lucro:r2(vend-custo),falta:r2(falta),devendo,avulso};
}
const prod=id=>S.produtos.find(p=>p.id===id);
const cli=id=>S.clientes.find(c=>c.id===id);

/* ---------- instalar como app (tela inicial do celular) ---------- */
let pedidoInstalar=null;
const instalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ehIphone=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInstalar=e;if(ui.view==='resumo'&&$('#sheet').hidden)render()});
window.addEventListener('appinstalled',()=>{pedidoInstalar=null;render();toast('Pronto! O Caderninho está na sua tela inicial')});
const bannerInstalar=()=>pedidoInstalar&&!instalado()?`<div class="banner"><span style="flex:1">Coloque o Caderninho na tela inicial, igual a um aplicativo.</span><button data-act="instalar">Instalar</button></div>`:'';
function blocoInstalar(){
  if(instalado())return '';
  const como=pedidoInstalar?`<button class="btn soft" data-act="instalar">Instalar o Caderninho</button>`
    :ehIphone()?`<p class="muted" style="margin:0">No Safari, toque no botão de compartilhar (o quadradinho com a setinha para cima) e depois em <b>“Adicionar à Tela de Início”</b>.</p>`
    :`<p class="muted" style="margin:0">No Chrome do celular, toque nos três pontinhos (⋮) no canto de cima e depois em <b>“Instalar app”</b> ou <b>“Adicionar à tela inicial”</b>.</p>`;
  return `<h2>Deixar com cara de app</h2><p class="muted" style="margin:0">Vai aparecer um ícone na tela do celular, igual ao de um aplicativo. Funciona até sem internet.</p>${como}`;
}

/* ---------- estado da tela ---------- */
const ui={view:'resumo',cliente:null,periodo:'mes',busca:'',venda:novaVenda(),aba:'resumo',mes:hoje().slice(0,7)};
function novaVenda(cid){return{clienteId:cid||null,itens:{},avulsos:[],data:hoje(),pagou:false,buscaCli:'',buscaProd:''}}

/* ---------- pedaços repetidos ---------- */
const avatar=n=>`<span class="avatar">${iniciais(n)}</span>`;
const thumb=p=>`<span class="thumb">${p.foto?`<img src="${p.foto}" alt="">`:iniciais(p.nome)}</span>`;
/* o que a venda levou: "2 Coxinha, 1 Suco" (valor digitado aparece só com o nome) */
const itensTxt=l=>l.itens.map(i=>i.produtoId?i.qtd+' '+esc(i.nome):esc(i.nome)).join(', ');
const subCli=(c,extra)=>[esc(c.obs),extra].filter(Boolean).join(' · ');

/* ---------- telas ---------- */
function vResumo(){
  const mes=hoje().slice(0,7);
  const r=resumo(ui.periodo==='mes'?mes:null);
  const nomeMes=new Date().toLocaleString('pt-BR',{month:'long'});
  if(!S.produtos.length&&!S.clientes.length){
    return `${bannerInstalar()}<div class="empty"><h1>Boas-vindas!</h1><p class="muted" style="margin:0">Aqui você anota quem comprou fiado, quanto deve e quem já pagou. As contas o Caderninho faz sozinho.</p>
      <div class="steps"><div><i>1</i>Quando alguém comprar fiado, toque em “Anotar venda”</div><div><i>2</i>Quando a pessoa pagar, toque em “Recebi”</div><div><i>3</i>Aqui no Resumo você vê quem deve e há quanto tempo</div></div>
      <button class="btn" data-act="ir" data-v="vender">${IC.plus}Anotar a primeira venda</button>
      <button class="btn ghost" data-act="novoProduto">Cadastrar meus produtos</button>
      <p class="muted small" style="margin:0">Cadastrar produtos é opcional: dá para anotar só o valor.</p>
      <button class="linkbtn" data-act="ir" data-v="planilha">Calcular custos e preços na planilha</button></div>`;
  }
  const dev=S.clientes.map(c=>({c,d:saldo(c.id).deve})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
  const semCusto=S.produtos.some(p=>p.ativo&&!(p.custo>0));
  const precisaBackup=S.lanc.length>0&&(!S.ultimoBackup||Date.now()-S.ultimoBackup>7*864e5);
  return `
  ${bannerInstalar()}
  ${precisaBackup?`<div class="banner"><span style="flex:1">Faz tempo que você não guarda uma cópia das suas contas.</span><button data-act="config">Guardar</button></div>`:''}
  <section class="card hero">
    <div class="lbl">Falta receber</div>
    <div class="big num ${r.falta>0?'c-bad':''}">${brl(r.falta)}</div>
    <div class="muted small">${r.devendo?`${r.devendo} ${r.devendo===1?'pessoa está':'pessoas estão'} devendo`:'Ninguém está devendo.'}</div>
  </section>
  <div class="seg" role="group" aria-label="Período">
    <button data-act="periodo" data-v="mes" aria-pressed="${ui.periodo==='mes'}">Em ${esc(nomeMes)}</button>
    <button data-act="periodo" data-v="tudo" aria-pressed="${ui.periodo==='tudo'}">Desde o começo</button>
  </div>
  <div class="grid2">
    <div class="card"><div class="lbl">Vendi</div><div class="mid num">${brl(r.vend)}</div></div>
    <div class="card"><div class="lbl">Recebi</div><div class="mid c-good num">${brl(r.rec)}</div></div>
  </div>
  <div class="card"><div class="lbl">Meu lucro</div><div class="mid num">${brl(r.lucro)}</div>
    <div class="muted small">${semCusto?'Para o lucro ficar certo, coloque quanto custa cada produto em “Produtos”.':'É o que vendi menos o que gastei com os produtos.'}${r.avulso?' Valores digitados à mão entram sem custo.':''}</div></div>
  <button class="btn ghost" data-act="ir" data-v="planilha">${IC.grade}Consultar planilha</button>
  <h2>Quem está devendo</h2>
  ${dev.length?`<div class="list">${dev.map(x=>`<button class="item" data-act="abrirCli" data-id="${x.c.id}">${avatar(x.c.nome)}<span class="grow"><span class="name">${esc(x.c.nome)}</span><span class="sub">${subCli(x.c,'desde '+fmtCurta(desde(x.c.id)))}</span></span><span class="val c-bad">${brl(x.d)}</span></button>`).join('')}</div>`
    :`<div class="card muted">Ninguém na lista. Todo mundo pagou.</div>`}`;
}

function linhaCli(c){const d=saldo(c.id).deve;
  const dir=d>0?`<span class="val c-bad">${brl(d)}</span>`:d<0?`<span class="pill good">Crédito ${brl(-d)}</span>`:'<span class="pill good">Em dia</span>';
  return `<button class="item" data-act="abrirCli" data-id="${c.id}">${avatar(c.nome)}<span class="grow"><span class="name">${esc(c.nome)}</span>${c.obs||d>0?`<span class="sub">${subCli(c,d>0?'desde '+fmtCurta(desde(c.id)):'')}</span>`:''}</span>${dir}</button>`}
function listaClientesHTML(){
  const b=norm(ui.busca);
  const l=S.clientes.filter(c=>bate(c,b)).sort(porNome);
  if(!S.clientes.length)return `<div class="empty"><p style="margin:0" class="muted">Você ainda não tem clientes. Toque no botão acima para adicionar o primeiro.</p></div>`;
  if(!l.length)return `<div class="card muted">Ninguém com esse nome.</div>`;
  return `<div class="list">${l.map(linhaCli).join('')}</div>`;
}
function vClientes(){
  return `<h1>Clientes</h1>
  <button class="btn" data-act="novoCli">${IC.plus}Novo cliente</button>
  ${S.clientes.length?`<input class="input" id="buscaCli" type="search" placeholder="Procurar pelo nome ou observação" value="${esc(ui.busca)}" autocomplete="off">`:''}
  <div id="listaCli">${listaClientesHTML()}</div>`;
}

function vCliente(){
  const c=cli(ui.cliente); if(!c){ui.view='clientes';return vClientes()}
  const s=saldo(c.id),d0=s.deve>0?desde(c.id):null;
  const hist=S.lanc.filter(l=>l.clienteId===c.id).sort((a,b)=>(b.data+b.criado).localeCompare(a.data+a.criado));
  const tel=String(c.tel||'').replace(/\D/g,'');
  const neg=S.ajustes.negocio.trim();
  const msg=`Oi, ${c.nome}! Tudo bem? Passando para lembrar do seu saldo em aberto: ${brl(s.deve)}. Qualquer dúvida, é só me chamar.${neg?'\n— '+neg:''}`;
  const zap='https://wa.me/'+(tel?(tel.length<=11?'55':'')+tel:'')+'?text='+encodeURIComponent(msg);
  return `<button class="back" data-act="ir" data-v="clientes">← Clientes</button>
  <div class="row" style="align-items:center"><div class="grow"><h1 style="overflow-wrap:anywhere">${esc(c.nome)}</h1>${c.obs||c.tel?`<div class="muted small" style="margin-top:2px">${[esc(c.obs),esc(c.tel)].filter(Boolean).join(' · ')}</div>`:''}</div><button class="btn ghost sm" data-act="editCli">Editar</button></div>
  <section class="card hero">
    <div class="lbl">${s.deve>0?'Está devendo':s.deve<0?'Pagou a mais (crédito)':'Está em dia'}</div>
    <div class="big num ${s.deve>0?'c-bad':'c-good'}">${brl(Math.abs(s.deve))}</div>
    ${d0?`<div class="small" style="margin-top:2px">Em aberto desde ${fmtData(d0)} (${haQuanto(d0)})</div>`:''}
    <div class="muted small num">Comprou ${brl(s.vendido)} no total · pagou ${brl(s.pago)}${s.ajuste<0?` · desconto ${brl(-s.ajuste)}`:s.ajuste>0?` · acréscimo ${brl(s.ajuste)}`:''}</div>
  </section>
  <div class="row"><button class="btn" data-act="venderPara" data-id="${c.id}">${IC.plus}Anotar venda</button><button class="btn good" data-act="pagar" ${s.deve>0?'':'disabled'}>${IC.money}Recebi</button></div>
  ${s.deve>0?`<a class="btn soft" href="${esc(zap)}" target="_blank" rel="noopener">${IC.zap}Cobrar no WhatsApp</a>`:''}
  ${hist.length?`<button class="btn ghost" data-act="ajustar">${IC.pen}Mudar o valor que deve</button>`:''}
  <h2>Histórico</h2>
  ${hist.length?`<p class="muted small" style="margin:-8px 0 0">Toque numa linha para corrigir ou apagar.</p><div class="list">${hist.map(l=>{
    const venda=l.tipo==='venda',aj=l.tipo==='ajuste',menos=aj?l.valor<0:!venda;
    const tit=venda?itensTxt(l):aj?(l.motivo==='presente'?'Desconto de presente':'Correção do valor'):'Pagamento';
    const tipo=venda?'Compra':aj?(l.valor<0?'Diminuiu o que deve':'Aumentou o que deve'):l.forma==='Na hora'?'Pago na hora':l.forma?esc(l.forma):'Pagamento';
    return `<button class="item" data-act="verLanc" data-id="${l.id}"><span class="grow"><span class="name">${tit}</span><span class="sub">${tipo} · ${fmtData(l.data)}</span></span><span class="val ${menos?'c-good':'c-bad'}">${l.tipo==='pag'?'+ ':''}${brl(Math.abs(l.valor))}</span></button>`}).join('')}</div>`
    :`<div class="card muted">Nada anotado ainda.</div>`}`;
}

/* escolher a pessoa: com muita gente, sem busca, mostra só quem comprou por último */
function chipsCliHTML(){
  const b=norm(ui.venda.buscaCli);
  let l=S.clientes.filter(c=>bate(c,b)),corte=false;
  if(!b&&l.length>12){const u={};for(const x of S.lanc)if(!u[x.clienteId]||x.criado>u[x.clienteId])u[x.clienteId]=x.criado;
    l=l.slice().sort((a,c)=>(u[c.id]||'').localeCompare(u[a.id]||'')).slice(0,12);corte=true}
  return l.sort(porNome).map(x=>`<button class="chip" data-act="escolherCli" data-id="${x.id}">${esc(x.nome)}${x.obs?` <small>${esc(x.obs)}</small>`:''}</button>`).join('')
    +'<button class="chip nova" data-act="novoCli" data-v="venda">+ Pessoa nova</button>'
    +(corte?'<p class="muted small" style="margin:2px 0 0;width:100%">Mostrando quem comprou por último. Procure pelo nome para achar outra pessoa.</p>':'')
    +(b&&!l.length?'<p class="muted small" style="margin:2px 0 0;width:100%">Ninguém com esse nome.</p>':'');
}
function prodsVendaHTML(){
  const v=ui.venda,b=norm(v.buscaProd);
  const l=S.produtos.filter(p=>p.ativo&&(!b||norm(p.nome).includes(b))).sort(porNome);
  if(!l.length)return `<div class="card muted">Nenhum produto com esse nome.</div>`;
  return `<div class="list">${l.map(p=>{const q=v.itens[p.id]||0;return `<div class="item pick ${q?'on':''}">
    <button class="pick-main" data-act="mais" data-id="${p.id}" aria-label="Pôr mais um ${esc(p.nome)}">${thumb(p)}<span class="grow"><span class="name">${esc(p.nome)}</span><span class="sub num">${brl(p.preco)}</span></span></button>
    ${q?`<div class="stepper"><button data-act="menos" data-id="${p.id}" aria-label="Tirar um">–</button><output class="num">${q}</output><button data-act="mais" data-id="${p.id}" aria-label="Pôr mais um">+</button></div>`
      :`<button class="add" data-act="mais" data-id="${p.id}" aria-label="Pôr ${esc(p.nome)}">${IC.plus}</button>`}</div>`}).join('')}</div>`;
}
function vVender(){
  const v=ui.venda;
  const ativos=S.produtos.filter(p=>p.ativo);
  const c=v.clienteId&&cli(v.clienteId);
  let total=0,n=0;for(const[id,q]of Object.entries(v.itens)){const p=prod(id);if(p&&q>0){total+=p.preco*q;n+=q}}
  for(const a of v.avulsos){total+=a.preco;n++}
  let quem;
  if(c){const s=saldo(c.id);

/* ---------- planilha: custos, preços e as contas do mês ----------
   Mesmas abas e contas da "planilha de custos" (app/planilha-modelo.xlsx). Clientes, produtos, vendas, pagamentos
   e acertos são os do app; o que é só da planilha fica em S.planilha. O custo que ela calcula (receita ou compra
   pronta, com as perdas) vai para p.custo, que é o que as vendas guardam. */
const CONTAS_PADRAO=[['Gás','A parte do gás usada no trabalho'],['Luz','Só a parte do trabalho, se der para separar'],['Água',''],['Internet e celular',''],['MEI (DAS)','Se for MEI, o boleto do mês'],['Transporte e entregas','Combustível, ônibus, motoboy'],['Manutenção de equipamentos','Guarde um pouco por mês para quando algo quebrar'],['Material de limpeza',''],['Divulgação','Cardápio, anúncio, cartão'],['Mensalidade da maquininha',''],['Aluguel ou ponto','A parte que usa']];
function planilhaPadrao(){return{contas:CONTAS_PADRAO.map(([nome,obs])=>({id:uid(),nome,valor:0,obs})),salario:0,dias:22,horasDia:5,taxas:.03,perdas:.05,lucro:.15,materiais:[],receitas:[],importados:[]}}
const PL=()=>S.planilha;
const nn=x=>Number(x)||0;
const lerNum=s=>{const v=parseMoney(s);return isNaN(v)?0:v};
const numStr=x=>x?String(x).replace('.',','):'';
const pct=x=>x==null||!isFinite(x)?'—':x.toLocaleString('pt-BR',{style:'percent',maximumFractionDigits:1});
const bv=x=>x==null||!isFinite(x)?'—':brl(x);
const porData=(a,b)=>(a.data+a.criado).localeCompare(b.data+b.criado);
const nomeMes=m=>{const[a,mm]=m.split('-');return new Date(+a,+mm-1,1).toLocaleString('pt-BR',{month:'long',year:'numeric'})};
const mesMais=(m,d)=>{const[a,mm]=m.split('-').map(Number),x=new Date(a,mm-1+d,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const kv=(rot,val,cls='')=>`<div class="kv"><span>${rot}</span><b class="${cls}">${val}</b></div>`;

const contasFixas=()=>r2(PL().contas.reduce((t,c)=>t+nn(c.valor),0));
const horasMes=()=>nn(PL().dias)*nn(PL().horasDia);
const valorHora=()=>horasMes()>0?(contasFixas()+nn(PL().salario))/horasMes():0;
const mat=id=>PL().materiais.find(m=>m.id===id);
const porMedida=m=>m.medida==='g'?'o quilo':m.medida==='ml'?'o litro':'a unidade';
const saiPor=m=>nn(m.qtd)>0?(m.medida==='g'||m.medida==='ml'?nn(m.preco)/m.qtd*1000:nn(m.preco)/m.qtd):null;
const custoLinha=r=>{const m=mat(r.materialId);return m&&nn(m.qtd)>0?nn(r.qtd)*nn(m.preco)/m.qtd:0};
const linhasReceita=pid=>PL().receitas.filter(r=>r.produtoId===pid);
const custoReceita=pid=>linhasReceita(pid).reduce((t,r)=>t+custoLinha(r),0);
/* aba Produtos, coluna por coluna: G custo da unidade, H tempo e contas, I custo completo, J mínimo, K sugerido… */
function calcProd(p){
  const pl=PL(),tx=nn(pl.taxas),pe=nn(pl.perdas),lu=nn(pl.lucro);
  const receita=custoReceita(p.id),paga=nn(p.paga),rende=nn(p.rende);
  let fonte=null,G=null;
  if(paga>0){fonte='pronto';G=paga*(1+pe)}
  else if(receita>0){if(rende>0){fonte='receita';G=receita*(1+pe)/rende}}
  else if(nn(p.custo)>0){fonte='app';G=nn(p.custo)}
  const H=G==null?null:fonte==='receita'?nn(p.horas)*valorHora()/rende:0;
  const I=G==null?null:G+H,J=I==null||tx>=1?null:I/(1-tx);
  let K=null;if(I!=null&&tx+lu<1){const x=I/(1-tx-lu);K=x<3?Math.ceil(x*10-1e-9)/10:Math.ceil(x*2-1e-9)/2}
  const L=nn(p.preco),M=I==null||!L?null:L-I-L*tx,N=M==null?null:M/L;
  const sit=!fonte&&!receita?'Falta a receita ou o custo':G==null?'Falta o rendimento':!L?'Falta o seu preço':L<G/(1-tx)?'Prejuízo':J!=null&&L<J-0.005?'Não paga o seu tempo':K!=null&&L<K-0.005?'Abaixo do sugerido':'Preço bom';
  return{fonte,receita,G,H,I,J,K,L,M,N,sit,sobra:G==null||!L?null:(L-G)/L-tx};
}
const sitCls=s=>s==='Preço bom'?'good':s==='Prejuízo'?'bad':s.startsWith('Falta')?'neutra':'warn';
/* o custo calculado aqui vai para o produto do app (só quando a planilha sabe calcular) */
function aplicarPlanilha(){for(const p of S.produtos){const c=calcProd(p);if(c.fonte==='pronto'||c.fonte==='receita')p.custo=Math.round(c.G*10000)/10000}}
/* Resumo da planilha: mes 'AAAA-MM' ou null para desde o começo */
function contasMes(mes){
  let vend=0,rec=0,custo=0;
  for(const l of S.lanc){if(mes&&!String(l.data).startsWith(mes))continue;if(l.tipo==='venda'){vend+=l.valor;custo+=l.custo||0}else if(l.tipo==='ajuste')vend+=l.valor;else rec+=l.valor}
  const taxas=vend*nn(PL().taxas);
  return{vend,rec,custo,taxas,sobrou:vend-custo-taxas};
}
function meta(mes){
  const pl=PL(),m=contasMes(mes);let sobra;
  if(m.vend>0)sobra=(m.vend-m.custo)/m.vend-nn(pl.taxas);
  else{const xs=S.produtos.map(p=>calcProd(p).sobra).filter(x=>x!=null);sobra=xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0}
  const precisa=contasFixas()+nn(pl.salario),vender=sobra>0&&precisa>0?precisa/sobra:null;
  const comLucro=sobra-nn(pl.lucro)>0&&precisa>0?precisa/(sobra-nn(pl.lucro)):null;
  return{sobra,precisa,vender,comLucro,vend:m.vend};
}
/* nome de cada cliente na planilha (que liga as abas pelo nome): dois "Pedro" viram "Pedro (5º ano)" */
function rotulosClientes(){
  const cont={};for(const c of S.clientes){const k=norm(c.nome);cont[k]=(cont[k]||0)+1}
  const m=new Map(),usados=new Set();
  for(const c of S.clientes.slice().sort(porNome)){
    let r=String(c.nome).trim()||'Sem nome';if(cont[norm(c.nome)]>1&&c.obs)r+=` (${c.obs})`;
    let k=r,n=2;while(usados.has(norm(k)))k=`${r} ${n++}`;usados.add(norm(k));m.set(c.id,k);
  }
  return m;
}

/* ---------- planilha de verdade (.xlsx) ----------
   Um .xlsx é um zip de XMLs. Baixar: abre app/planilha-modelo.xlsx, escreve os dados do app nas células de
   preencher (as fórmulas ficam) e pede para o Excel recalcular ao abrir. Trazer: lê as mesmas células.
   Linhas que vieram do app levam um código numa coluna escondida; só entra no app o que não tem código. */
const NSX='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function lerZip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder(),out=new Map();
  let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;

}
async function fazerZip(arqs){
  const partes=[],central=[],te=new TextEncoder();let off=0;
  for(const[nome,dado] of arqs){
    const nb=te.encode(nome),crc=crc32(dado);let z=dado,met=0;

    const h=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,met,2],[12,33,2],[14,crc,4],[18,z.length,4],[22,dado.length,4],[26,nb.length,2]].forEach(([o,v,t])=>t===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    const c=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,met,2],[14,33,2],[16,crc,4],[20,z.length,4],[24,dado.length,4],[28,nb.length,2],[42,off,4]].forEach(([o,v,t])=>t===4?c.setUint32(o,v,true):c.setUint16(o,v,true));

/* aba (nome) → arquivo dentro do zip, e as palavras guardadas à parte (sharedStrings) */
function abasDoZip(zip){

  for(const r of rels.getElementsByTagName('Relationship')){const t=r.getAttribute('Target');alvo[r.getAttribute('Id')]=t.startsWith('/')?t.slice(1):'xl/'+t}

    const c=el('c'),cn=coluna(ref);c.setAttribute('r',ref);let antes=null;for(const x of r.children)if(coluna(x.getAttribute('r'))>cn){antes=x;break}

  }

    por(ref,v){const vazio=v===''||v==null,c=cel(ref,!vazio);if(!c)return;while(c.firstChild)c.removeChild(c.firstChild);c.removeAttribute('t');if(vazio)return;

const serial=d=>{const[a,m,dd]=String(d).split('-').map(Number);return Math.round((Date.UTC(a,m-1,dd)-Date.UTC(1899,11,30))/864e5)};
function dataDe(x){

  [['Quanto preciso para viver',pl.salario],['Dias que trabalho',pl.dias],['Horas por dia',pl.horasDia],['Taxas sobre',pl.taxas],['Perdas',pl.perdas],['Lucro que eu quero',pl.lucro]].forEach(([t,v])=>{const r=mm.achar(t,c1);if(r)mm.por('C'+r,nn(v))});
  const te=new TextEncoder();
  for(const n of PLANILHA_ABAS){F[n].semCache();zip.set(ab[n],te.encode(F[n].xml()))}
  zip.set('xl/workbook.xml',te.encode(new TextDecoder().decode(zip.get('xl/workbook.xml')).replace(/<calcPr\b/,'<calcPr fullCalcOnLoad="1"')));
  zip.delete('xl/calcChain.xml');
  baixarBlob(await fazerZip([...zip]),`caderninho-planilha-${hoje()}.xlsx`);
  toast(cheio?'Planilha baixada, mas tinha mais linhas do que ela comporta: algumas contas podem ficar de fora.':'Planilha baixada. Fica na pasta “Downloads”.',cheio);
}

/* ler a planilha editada e mostrar o que vai mudar antes de mexer em qualquer coisa */
const assinatura=(aba,r,vals)=>{let h=5381;const s=aba+'|'+r+'|'+vals.join('|');for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return aba+r+':'+(h>>>0).toString(36)};
async function trazerPlanilha(arq){
  let zip,ab;
  try{zip=await lerZip(await arq.arrayBuffer());ab=abasDoZip(zip)}catch(err){toast('Não consegui abrir esse arquivo. Ele precisa ser uma planilha do Excel (.xlsx).',true);return}
  if(!['Vendas','Recebi','Acertos','Clientes','Produtos','Meu Mês'].every(n=>ab[n]&&zip.get(ab[n]))){toast('Essa não é a planilha do Caderninho.',true);return}
  const sst=lerSST(zip),td=new TextDecoder(),F={};for(const n of PLANILHA_ABAS)if(ab[n]&&zip.get(ab[n]))F[n]=folha(td.decode(zip.get(ab[n])),sst);
  const txt=x=>String(x??'').trim(),num=x=>typeof x==='number'?x:lerNum(x);
  const ler=(f,cols,de,ate)=>{const out=[];if(!f)return out;for(let r=de;r<=ate;r++){const o={r};for(const c of cols)o[c]=f.ler(c+r);if(cols.some(c=>txt(o[c])!==''))out.push(o)}return out};
  const mm=F['Meu Mês'],c0=mm.achar('Conta')+1,c1=mm.achar('Total das contas')-1,linhaMM=t=>{const r=mm.achar(t,c1);return r?num(mm.ler('C'+r)):0};
  const imp=new Set(PL().importados||[]);
  const novas=(aba,ls,id,vals)=>ls.filter(o=>!txt(o[id])).map(o=>Object.assign(o,{sig:assinatura(aba,o.r,vals.map(c=>txt(o[c])))})).filter(o=>!imp.has(o.sig));
  const pl={
    negocio:F['Início']?txt(F['Início'].ler('D4')):'',
    mes:{contas:ler(mm,['B','C','D'],c0,c1).filter(o=>txt(o.B)||num(o.C)).map(o=>({nome:txt(o.B)||'Conta',valor:num(o.C),obs:txt(o.D)})),
      salario:linhaMM('Quanto preciso para viver'),dias:linhaMM('Dias que trabalho'),horasDia:linhaMM('Horas por dia'),taxas:linhaMM('Taxas sobre'),perdas:linhaMM('Perdas'),lucro:linhaMM('Lucro que eu quero')},
    materiais:ler(F.Materiais,['B','C','D','E','F','I','J'],5,204).filter(o=>txt(o.B)).map(o=>({nome:txt(o.B),tipo:txt(o.C)||'Ingrediente',medida:['g','ml','un'].includes(txt(o.D))?txt(o.D):'un',qtd:num(o.E),preco:num(o.F),onde:txt(o.I),data:o.J===''?hoje():dataDe(o.J)})),
    produtos:ler(F.Produtos,['B','C','D','E','L'],5,104).filter(o=>txt(o.B)).map(o=>({nome:txt(o.B),rende:num(o.C),horas:num(o.D),paga:num(o.E),preco:num(o.L)})),
    receitas:ler(F.Receitas,['B','C','D','G'],5,504).filter(o=>txt(o.B)&&txt(o.C)).map(o=>({produto:txt(o.B),material:txt(o.C),qtd:num(o.D),obs:txt(o.G)})),
    clientes:ler(F.Clientes,['B','C','D'],5,304).filter(o=>txt(o.B)).map(o=>({nome:txt(o.B),tel:txt(o.C),obs:txt(o.D)})),
    vendas:novas('V',ler(F.Vendas,['B','C','D','E','F','J','K'],5,3004).filter(o=>txt(o.C)&&(txt(o.D)||txt(o.F))),'K',['B','C','D','E','F','J']),
    recebi:novas('R',ler(F.Recebi,['B','C','D','E','F','G'],5,3004).filter(o=>txt(o.C)&&num(o.D)),'G',['B','C','D','E','F']),
    acertos:novas('A',ler(F.Acertos,['B','C','D','E','F','G'],5,504).filter(o=>txt(o.C)&&num(o.D)),'G',['B','C','D','E','F'])
  };
  const nomes=new Set([...rotulosClientes().values(),...S.clientes.map(c=>c.nome)].map(norm));
  const cliNovos=new Set([...pl.clientes.map(c=>c.nome),...pl.vendas.map(o=>txt(o.C)),...pl.recebi.map(o=>txt(o.C)),...pl.acertos.map(o=>txt(o.C))].filter(n=>!nomes.has(norm(n))).map(norm)).size;
  const prodNovos=pl.produtos.filter(p=>!S.produtos.some(x=>norm(x.nome)===norm(p.nome))).length;
  const conta=(n,um,varios)=>`<li>${n} ${n===1?um:varios}</li>`;
  perguntar('Trazer a planilha para o app?',`Encontrei na planilha:<ul style="margin:8px 0;padding-left:20px">${conta(pl.vendas.length,'venda nova','vendas novas')}${conta(pl.recebi.length,'pagamento novo','pagamentos novos')}${conta(pl.acertos.length,'acerto novo','acertos novos')}${conta(cliNovos,'cliente novo','clientes novos')}${conta(prodNovos,'produto novo','produtos novos')}<li>Meu Mês, materiais, receitas, custos e preços</li></ul>O que já veio do app não muda. Para corrigir ou apagar uma venda, um pagamento ou um acerto, use o app.`,'Sim, trazer',()=>{aplicarImportacao(pl);fechar();render();toast('Planilha trazida para o app')},'');
}
function aplicarImportacao(pl){
  const P=PL(),rot=rotulosClientes(),cliPor=new Map();
  for(const c of S.clientes){cliPor.set(norm(rot.get(c.id)),c.id);if(!cliPor.has(norm(c.nome)))cliPor.set(norm(c.nome),c.id)}
  if(pl.negocio)S.ajustes.negocio=pl.negocio;
  P.contas=pl.mes.contas.map(c=>Object.assign({id:uid()},c));
  for(const k of ['salario','dias','horasDia','taxas','perdas','lucro'])P[k]=pl.mes[k];
  const matAnt=new Map(P.materiais.map(m=>[norm(m.nome),m.id]));
  P.materiais=pl.materiais.map(m=>Object.assign({id:matAnt.get(norm(m.nome))||uid()},m));
  for(const c of pl.clientes){const id=cliPor.get(norm(c.nome));if(id){const x=cli(id);x.tel=c.tel;x.obs=c.obs}else{const x={id:uid(),nome:c.nome,tel:c.tel,obs:c.obs};S.clientes.push(x);cliPor.set(norm(c.nome),x.id)}}
  const prodPor=new Map(S.produtos.map(p=>[norm(p.nome),p]));
  for(const p of pl.produtos){let x=prodPor.get(norm(p.nome));if(!x){x={id:uid(),nome:p.nome,preco:0,custo:0,foto:null,ativo:true};S.produtos.push(x);prodPor.set(norm(p.nome),x)}
    x.rende=p.rende;x.horas=p.horas;x.paga=p.paga;if(p.preco>0)x.preco=p.preco}
  const matPor=new Map(P.materiais.map(m=>[norm(m.nome),m.id]));
  P.receitas=pl.receitas.map(r=>({id:uid(),produtoId:(prodPor.get(norm(r.produto))||{}).id,materialId:matPor.get(norm(r.material)),qtd:r.qtd,obs:r.obs})).filter(r=>r.produtoId&&r.materialId);
  aplicarPlanilha();
  const idCli=nome=>{let id=cliPor.get(norm(nome));if(!id){const x={id:uid(),nome,tel:'',obs:''};S.clientes.push(x);id=x.id;cliPor.set(norm(nome),id)}return id};
  const txt=x=>String(x??'').trim(),num=x=>typeof x==='number'?x:lerNum(x);let t=Date.now();const criado=()=>new Date(t++).toISOString();
  for(const o of pl.vendas){const p=prodPor.get(norm(o.D)),qtd=num(o.E)>0?num(o.E):1,preco=num(o.F)>0?num(o.F):p?nn(p.preco):0,data=dataDe(o.B),cr=criado();
    const item=p?{produtoId:p.id,nome:p.nome,qtd,preco,custo:nn(p.custo)}:{produtoId:null,nome:(qtd>1?qtd+' ':'')+(txt(o.D)||'Valor avulso'),qtd:1,preco:r2(preco*qtd),custo:0};
    const l={id:uid(),tipo:'venda',clienteId:idCli(txt(o.C)),itens:[item],valor:r2(item.preco*item.qtd),custo:r2(item.custo*item.qtd),data,criado:cr};S.lanc.push(l);
    if(/^s/i.test(txt(o.J)))S.lanc.push({id:uid(),tipo:'pag',clienteId:l.clienteId,valor:l.valor,forma:'Na hora',data,criado:cr+'1'})}
  for(const o of pl.recebi)S.lanc.push({id:uid(),tipo:'pag',clienteId:idCli(txt(o.C)),valor:r2(num(o.D)),forma:txt(o.E)||'Dinheiro',obs:txt(o.F),data:dataDe(o.B),criado:criado()});
  for(const o of pl.acertos)S.lanc.push({id:uid(),tipo:'ajuste',clienteId:idCli(txt(o.C)),valor:r2(num(o.D)),motivo:/corre/i.test(txt(o.E))?'erro':'presente',obs:txt(o.F),data:dataDe(o.B),criado:criado()});
  P.importados=[...(P.importados||[]),...pl.vendas,...pl.recebi,...pl.acertos].map(o=>o.sig||o);
  salvar();
}

    case 'editTempo': formTempo(); break;
    case 'salvarTempo': { const P=PL(); P.salario=lerNum($('#tSal').value); P.dias=lerNum($('#tDias').value); P.horasDia=lerNum($('#tHoras').value);
      aplicarPlanilha(); salvar(); fechar(); render(); toast(`Sua hora vale ${brl(valorHora())}`); break;}
    case 'editPct': formPct(); break;
    case 'salvarPct': { const t=lerNum($('#xTaxas').value)/100,pe=lerNum($('#xPerdas').value)/100,lu=lerNum($('#xLucro').value)/100;
      if(t<0||pe<0||lu<0||t+lu>=1){toast('As porcentagens ficaram estranhas. Ex.: taxas 3, perdas 5, lucro 15',true);return}
      Object.assign(PL(),{taxas:t,perdas:pe,lucro:lu}); aplicarPlanilha(); salvar(); fechar(); render(); toast('Porcentagens salvas'); break;}
    case 'baixarPlanilha': try{await baixarPlanilha()}catch(err){toast('Não consegui montar a planilha aqui. Tente de novo.',true)} break;
    case 'novoProduto': formProd(null); break;
    case 'editProd': formProd(prod(id)); break;
    case 'toggleAtivo': b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true'); break;
    case 'semFoto': fotoTemp=null; $('#fotoBox').innerHTML=fotoHTML(); b.hidden=true; break;
    case 'salvarProd': {
      const ce=$('#pCusto'),nome=$('#pNome').value.trim(),preco=parseMoney($('#pPreco').value),cr=ce?ce.value.trim():'',custo=ce?(cr?parseMoney(cr):0):prod(id).custo;
      if(!nome){toast('Escreva o nome do produto.',true);$('#pNome').focus();return}
      if(!(preco>0)){toast('Escreva o preço. Ex.: 12,00',true);$('#pPreco').focus();return}
      if(isNaN(custo)||custo<0){toast('O custo ficou estranho. Ex.: 4,50',true);ce.focus();return}
      if(id){const p=prod(id);Object.assign(p,{nome,preco,custo,foto:fotoTemp,ativo:$('#pAtivo').getAttribute('aria-checked')==='true'})}
      else S.produtos.push({id:uid(),nome,preco,custo,foto:fotoTemp,ativo:true});
      aplicarPlanilha();salvar();fechar();render();toast(id?'Produto atualizado':'Produto criado');break;}
    case 'apagarProd': perguntar('Apagar este produto?','Ele some da lista de produtos.','Sim, apagar',()=>{S.produtos=S.produtos.filter(p=>p.id!==id);PL().receitas=PL().receitas.filter(r=>r.produtoId!==id);salvar();fechar();render();toast('Produto apagado')}); break;
    case 'sim': if(confirmar){const f=confirmar;confirmar=null;f()} break;
    case 'fechar': fechar(); break;
    case 'config': formConfig(); break;
    case 'salvarNegocio': S.ajustes.negocio=$('#aNeg').value.trim(); salvar(); render(); toast(S.ajustes.negocio?'Nome do negócio salvo':'Nome do negócio apagado'); break;
    case 'instalar': { const p=pedidoInstalar; if(!p)return; pedidoInstalar=null; fechar(); render();
      try{await p.prompt()}catch(err){} break;}
    case 'baixar': {
      try{
        const url=URL.createObjectURL(new Blob([backupTexto()],{type:'application/json'}));
        const link=document.createElement('a');link.href=url;link.download='caderninho-'+hoje()+'.json';
        document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
        marcarBackup();toast('Cópia salva. Fica na pasta “Downloads”.');
      }catch(err){toast('Não deu para salvar arquivo aqui. Use “Copiar cópia”.',true)}
      break;}
    case 'copiar': {
      const t=backupTexto();
      try{await navigator.clipboard.writeText(t);marcarBackup();toast('Copiado! Cole numa conversa sua no WhatsApp')}
      catch(err){const ta=$('#restTxt');ta.value=t;ta.focus();ta.select();toast('Selecionei o texto da cópia. Toque e segure para copiar.',true)}
      break;}
    case 'restaurarTxt': { const t=$('#restTxt').value.trim(); if(!t){toast('Cole o texto da cópia primeiro.',true);return} restaurar(t); break;}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='buscaCli'){ui.busca=e.target.value;$('#listaCli').innerHTML=listaClientesHTML()}
  if(e.target.id==='buscaVenda'){ui.venda.buscaCli=e.target.value;$('#chipsCli').innerHTML=chipsCliHTML()}
  if(e.target.id==='buscaProd'){ui.venda.buscaProd=e.target.value;$('#listaProd').innerHTML=prodsVendaHTML()}
  if(e.target.classList.contains('evval')){edit.itens[e.target.dataset.v].preco=parseMoney(e.target.value)||0;$('#evTotal').textContent=brl(totalEdit())}
  if(e.target.id==='evData')edit.data=e.target.value;
  if(e.target.classList.contains('recmat')||e.target.classList.contains('recqtd')){const k=+e.target.dataset.v,r=rec.linhas[k];
    if(e.target.classList.contains('recmat'))r.materialId=e.target.value; else r.qtd=lerNum(e.target.value);
    const m=mat(r.materialId);$('#recMed'+k).textContent=m?m.medida:'';$('#recCus'+k).textContent=brl(custoLinha(r));$('#recTotal').textContent=brl(rec.linhas.reduce((t,x)=>t+custoLinha(x),0))}
  if(e.target.id==='dataVenda')ui.venda.data=e.target.value;
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if((t.id==='fotoCam'||t.id==='fotoGal')&&t.files&&t.files[0]){
    try{fotoTemp=await comprimir(t.files[0]);$('#fotoBox').innerHTML=fotoHTML();$('#semFoto').hidden=false}catch(err){toast('Não consegui abrir essa foto. Tente outra.',true)}
  }
  if(t.id==='planArq'&&t.files&&t.files[0]){const f=t.files[0];t.value='';trazerPlanilha(f).catch(()=>toast('Não consegui ler essa planilha.',true))}
  if(t.id==='restArq'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>restaurar(String(fr.result));fr.readAsText(t.files[0])}
});

/* ---------- começar ---------- */
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  await carregar();completar();render();
})();
/* funciona sem internet depois da primeira vez */
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
